<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mariage XN & Nathan</title>

<!-- Open Graph: contrôle l'aperçu affiché quand ce lien est partagé sur WhatsApp, iMessage, etc. -->
<meta property="og:title" content="Save the date — Mariage 10 juillet 2027">
<meta property="og:description" content="Ouvrez l'enveloppe pour découvrir votre invitation !">
<meta property="og:image" content="https://nathanemac.github.io/save-the-date/photo.png">
<meta property="og:type" content="website">

<!-- GSAP : bibliothèque d'animation gratuite (MIT) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<style>
  html,body{margin:0;padding:0;background:#ede3d1;font-family:Georgia,'Times New Roman',serif;}
  .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 14px;box-sizing:border-box;position:relative;overflow:hidden;}

  /* --- Enveloppe --- */
  .envelope-wrap{cursor:pointer;text-align:center;user-select:none;}
  .envelope{position:relative;width:300px;height:210px;margin:0 auto;perspective:1200px;}
  .envelope-body{position:absolute;inset:0;background:linear-gradient(180deg,#f8efdc,#f0e2c4);border:1px solid #cdb079;border-radius:6px;box-shadow:0 18px 40px rgba(80,50,20,.25);overflow:hidden;}
  .envelope-body::before{content:"";position:absolute;left:0;right:0;bottom:0;height:70%;background:linear-gradient(135deg,transparent 49.4%,rgba(205,176,121,.35) 50%,transparent 50.6%),linear-gradient(-135deg,transparent 49.4%,rgba(205,176,121,.35) 50%,transparent 50.6%);}
  .envelope-flap{position:absolute;top:0;left:0;width:100%;height:105px;background:linear-gradient(160deg,#e9d9b3,#dcc79a);clip-path:polygon(0 0,100% 0,50% 92%);transform-origin:top center;transform-style:preserve-3d;box-shadow:0 6px 14px rgba(80,50,20,.12);z-index:3;}
  .envelope-seal{position:absolute;top:78px;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;background:radial-gradient(circle at 35% 30%,#c94b3f,#8f1a14);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fbe9d8;font-size:21px;z-index:4;box-shadow:0 3px 8px rgba(0,0,0,.3),inset 0 1px 2px rgba(255,255,255,.25);}
  .envelope-card{position:absolute;left:14px;right:14px;bottom:10px;top:26px;background:#fffdf8;border:1px solid #d8c49a;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,.08);z-index:2;}
  .hint{margin-top:20px;color:#7a6650;font-style:italic;font-size:15px;letter-spacing:.02em;}

  /* --- Invitation révélée --- */
  .invitation{max-width:600px;width:100%;opacity:0;pointer-events:none;position:absolute;}
  .invitation.show{pointer-events:auto;position:relative;}

  .card{width:100%;font-family:Georgia,'Times New Roman',serif;}
  .frame{background:#f6ecd8;border:1px solid #cdb079;padding:9px;margin-bottom:24px;}
  .frame img{display:block;width:100%;height:auto;border:0;border-radius:2px;}
  .divider{text-align:center;color:#a11f1a;font-size:24px;line-height:1;letter-spacing:2px;margin-bottom:20px;}
  .btn-row{text-align:center;margin-bottom:14px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .btn{display:inline-block;padding:16px 28px;font-family:Georgia,'Times New Roman',serif;font-size:15px;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:#fbf1e6;text-decoration:none;background:#a11f1a;border:1px solid #7c1512;border-radius:999px;white-space:nowrap;}
  .caption{text-align:center;font-style:italic;font-size:20px;color:#7a6650;margin-bottom:6px;}
  .date{text-align:center;font-size:14px;font-weight:bold;letter-spacing:.06em;color:#4f3f30;}

  /* --- Effets : oiseaux abstraits et pétales --- */
  .fx-layer{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden;}
  .fx-bird{position:absolute;}
  .petal{position:absolute;border-radius:50% 50% 50% 0;}
</style>
</head>
<body>

<div class="fx-layer" id="fxLayer"></div>

<div class="stage">

  <!-- Enveloppe cliquable -->
  <div class="envelope-wrap" id="envelopeWrap" onclick="openEnvelope()">
    <div class="envelope">
      <div class="envelope-card"></div>
      <div class="envelope-body"></div>
      <div class="envelope-flap"></div>
      <div class="envelope-seal">囍</div>
    </div>
    <div class="hint" id="hint">Cliquez pour ouvrir votre invitation</div>
  </div>

  <script>
    var idleFloat = gsap.to('.envelope', { y: -8, duration: 1.4, ease: 'sine.inOut', repeat: -1, yoyo: true });
  </script>

  <!-- Invitation révélée -->
  <div class="invitation" id="invitation">
    <div class="card">
      <div class="frame">
        <img src="photo.png" alt="Photo des mariés">
      </div>
      <div class="divider">囍</div>
      <div class="btn-row">
        <a class="btn" href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Save+the+Date+%E2%80%94+Mariage&dates=20270710/20270711&location=Ch%C3%A2teau+de+la+Batisse%2C+Rte+de+Varennes%2C+63450+Chanonat%2C+France&details=R%C3%A9servez+la+date+%21">
          📅&nbsp;&nbsp;Save the date (Google)
        </a>
        <a class="btn" href="invite.ics">
          📅&nbsp;&nbsp;Save the date (Apple / Outlook)
        </a>
      </div>
      <div class="caption">Venez célébrer le lien qui nous unit !&nbsp;!</div>
      <div class="date">SAMEDI 10 JUILLET 2027 · JOURNÉE ENTIÈRE</div>
    </div>
  </div>

</div>

<script>
  // oiseaux abstraits : silhouette minimaliste en deux traits (aile gauche / aile droite)
  function spawnBirds(originX, originY){
    var layer = document.getElementById('fxLayer');
    var colors = ['#8a6a4f', '#a11f1a', '#cdb079'];
    var flights = [
      { x: -240, y: -300, rot: -8 },
      { x: 10,   y: -360, rot: 0 },
      { x: 260,  y: -280, rot: 8 }
    ];
    flights.forEach(function(dir, i){
      var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('class', 'fx-bird');
      svg.setAttribute('width', '30');
      svg.setAttribute('height', '18');
      svg.setAttribute('viewBox', '0 0 34 20');
      svg.style.left = (originX - 15) + 'px';
      svg.style.top = (originY - 9) + 'px';
      var color = colors[i % colors.length];
      svg.innerHTML =
        '<path class="wing-l" d="M17,10 C12,2 5,2 0,8" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round"/>' +
        '<path class="wing-r" d="M17,10 C22,2 29,2 34,8" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round"/>';
      layer.appendChild(svg);

      var wingL = svg.querySelector('.wing-l');
      var wingR = svg.querySelector('.wing-r');
      gsap.set([wingL, wingR], { transformOrigin: '17px 10px' });
      gsap.to(wingL, { rotation: -16, duration: .11, yoyo: true, repeat: 22, ease: 'sine.inOut' });
      gsap.to(wingR, { rotation: 16, duration: .11, yoyo: true, repeat: 22, ease: 'sine.inOut' });

      gsap.to(svg, {
        x: dir.x, y: dir.y, rotation: dir.rot, opacity: 0,
        duration: 2.6, delay: i * .12, ease: 'power1.in',
        onComplete: function(){ svg.remove(); }
      });
    });
  }

  // pétales : quelques-uns qui tombent doucement, sans surcharger la scène
  function spawnPetals(){
    var layer = document.getElementById('fxLayer');
    var colors = ['#cdb079', '#c9a06b', '#b98a86'];
    var count = 12;
    for (var i = 0; i < count; i++){
      (function(i){
        setTimeout(function(){
          var petal = document.createElement('div');
          petal.className = 'petal';
          var size = 8 + Math.random() * 5;
          petal.style.width = size + 'px';
          petal.style.height = (size * 1.4) + 'px';
          petal.style.left = (Math.random() * 100) + 'vw';
          petal.style.top = '-20px';
          petal.style.background = colors[i % colors.length];
          petal.style.opacity = .45 + Math.random() * .25;
          var startRot = Math.random() * 360;
          gsap.set(petal, { rotation: startRot });
          layer.appendChild(petal);

          var duration = 5 + Math.random() * 3;
          var drift = (Math.random() - .5) * 140;

          gsap.to(petal, { y: window.innerHeight + 40, duration: duration, ease: 'none', onComplete: function(){ petal.remove(); } });
          gsap.to(petal, { x: drift, duration: duration / 2, yoyo: true, repeat: 1, ease: 'sine.inOut' });
          gsap.to(petal, { rotation: startRot + (Math.random() > .5 ? 320 : -320), duration: duration, ease: 'none' });
        }, i * 350);
      })(i);
    }
  }

  function openEnvelope(){
    var wrap = document.getElementById('envelopeWrap');
    if (wrap.dataset.open) return;
    wrap.dataset.open = "1";
    idleFloat.kill();
    gsap.set('.envelope', { y: 0 });

    var sealRect = document.querySelector('.envelope-seal').getBoundingClientRect();

    var tl = gsap.timeline();

    // le sceau se brise et disparaît, les oiseaux s'envolent
    tl.to('.envelope-seal', { scale: 0, rotate: 25, duration: .35, ease: 'back.in(2)' });
    tl.call(function(){ spawnBirds(sealRect.left + sealRect.width / 2, sealRect.top + sealRect.height / 2); }, null, '<');

    // la pochette s'incline légèrement puis le rabat s'ouvre en 3D
    tl.to('.envelope', { rotationX: 8, duration: .2, ease: 'power1.out' }, '-=.1');
    tl.to('.envelope-flap', { rotationX: 180, duration: .7, ease: 'power2.inOut' }, '<');

    // la carte sort de l'enveloppe
    tl.to('.envelope-card', { y: -170, scale: 1.03, duration: .6, ease: 'power2.out' }, '-=.35');

    // fondu de l'enveloppe vers l'invitation complète
    tl.to('#hint', { opacity: 0, duration: .3 }, '-=.5');
    tl.to('.envelope-wrap', { opacity: 0, duration: .4, onComplete: function(){ wrap.style.display = 'none'; } }, '-=.2');
    tl.fromTo('#invitation', { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: .6, ease: 'power2.out', onStart: function(){ document.getElementById('invitation').classList.add('show'); } }, '-=.2');
    tl.call(spawnPetals, null, '-=.3');
  }
</script>

</body>
</html>
